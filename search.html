<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поиск — Полка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container results-layout">
    <div>
      <button class="btn btn-outline btn-sm filters-toggle" type="button" id="filters-toggle" aria-expanded="false" aria-controls="filters"></button>
      <aside class="filters" id="filters" aria-label="Фильтры">
        <div class="filters-head"><h2>Фильтры</h2><button class="link-btn" type="button" id="reset">Сбросить</button></div>
        <div class="f-group"><h3>Жанр</h3><div id="f-genre"></div></div>
        <div class="f-group"><h3>Язык</h3><div id="f-lang"></div></div>
        <div class="f-group">
          <h3>Год издания</h3>
          <div class="years">
            <input type="number" id="f-from" placeholder="от" min="1000" max="2100" inputmode="numeric" aria-label="Год от">
            <span>—</span>
            <input type="number" id="f-to" placeholder="до" min="1000" max="2100" inputmode="numeric" aria-label="Год до">
          </div>
        </div>
        <div class="f-group">
          <h3>Доступ</h3>
          <div class="segmented" id="f-access">
            <button type="button" data-v="all">Все</button>
            <button type="button" data-v="free">Бесплатные</button>
            <button type="button" data-v="paid">Платные</button>
          </div>
        </div>
        <div class="f-group"><h3>Формат</h3><div id="f-format"></div></div>
      </aside>
    </div>

    <section aria-live="polite">
      <h1 class="results-title" id="r-title">Каталог</h1>
      <p class="results-sub" id="r-sub"></p>
      <div class="toolbar">
        <div class="active-chips" id="chips"></div>
        <div class="sort" id="sort">
          <span>Сортировка:</span>
          <button class="btn btn-outline" type="button" data-v="pop">Популярность</button>
          <button class="btn btn-outline" type="button" data-v="rating">Рейтинг</button>
          <button class="btn btn-outline" type="button" data-v="new">Новизна</button>
        </div>
      </div>
      <div class="results-grid" id="grid"></div>
      <nav class="pagination" id="pagination" aria-label="Страницы"></nav>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/books.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
